[package]
name = "tl-inventory"
version = "0.1.0"
description = "Read-only inventory of every network connection on a Linux host, attributed to the process, systemd unit or desktop app that owns it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No dependencies on purpose. This crate reads /proc and nothing else, and a
# tool whose job is to tell you what is talking to the internet should not
# itself pull in a tree of code you have not read.
[dependencies]
