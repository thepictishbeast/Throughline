[package]
name = "tl-policy"
version = "0.1.0"
description = "Compile a per-application routing policy into an nftables ruleset, ip rules and torrc lines, refusing any plan that would strand the operator."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only the inventory crate, so there is one parser for /proc rather than
# two that can disagree about what is connected.
[dependencies]
tl-inventory = { path = "../tl-inventory" }
